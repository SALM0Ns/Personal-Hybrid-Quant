[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-hybrid-quant"
version = "0.1.0"
description = "Personal multi-asset hybrid quantitative trading research system"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Project Owner" }]
dependencies = [
  "ccxt",
  "duckdb",
  "pandera",
  "polars",
  "pytz",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/quant"]
