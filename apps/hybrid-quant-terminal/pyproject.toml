[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mt5-market-data-foundation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["polars>=1.0", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/mt5_market_data"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
# Generated runtime, backups and disposable test data are not source code.
extend-exclude = [".test-tmp", ".local-dev", "runtime", "runtime-backups"]
